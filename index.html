<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Motif — Cultural journal</title>
    <link rel="stylesheet" href="style.css?v=2.0.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-theme">
    <div id="landing-page" class="landing-page">
        <div class="landing-background">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>
        <div class="landing-content">
            <h1 class="landing-title">My Motif</h1>
            <p class="landing-subtitle">A spatial journal for cultural discovery. Write what you feel — get curated music, art, and a path to go deeper.</p>
            <div style="display:flex; flex-direction:column; gap:16px;">
                <button type="button" class="primary-btn" id="signup-google-btn"><i class="fa-brands fa-google"></i> Sign Up with Google</button>
                <p style="font-size: 13px; color: var(--text-secondary);">Already have an account? <a href="#" id="login-google-btn" style="color: var(--accent); font-weight:600; text-decoration:none;">Log in</a></p>
            </div>
        </div>
    </div>

    <header class="top-toolbar white-panel">
        <div class="logo">My Motif</div>
        <div class="divider-vertical"></div>
        <div class="tools">
            <button type="button" class="tool-btn active" data-tool="select" title="Select Tool (V)"><i class="fa-solid fa-arrow-pointer"></i></button>
            <button type="button" class="tool-btn" data-tool="pan" title="Pan Tool (Space + Drag)"><i class="fa-solid fa-hand"></i></button>
            <div class="divider-vertical"></div>
            <button type="button" class="tool-btn" data-tool="board" title="Draw Board (B)"><i class="fa-solid fa-layer-group"></i> Board</button>
            <button type="button" class="tool-btn" data-tool="frame" title="Draw Frame (F)"><i class="fa-regular fa-square-plus"></i> Frame</button>
        </div>
        <div class="divider-vertical"></div>
        <div class="user-actions">
            <button type="button" class="icon-btn" id="save-cloud-btn" title="Save to Cloud" style="display: none;"><i class="fa-solid fa-cloud-arrow-up"></i></button>
            <button type="button" class="icon-btn login-trigger" title="Log In"><i class="fa-solid fa-user"></i></button>
        </div>
    </header>

    <div class="app-container">
        <main id="board-container">
            <div id="canvas">
                <div id="ghost-frame"></div>
            </div>
        </main>
    </div>

    <script type="module" src="script.js?v=2.0.0"></script>
</body>
</html>
